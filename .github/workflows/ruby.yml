name: Ruby

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "**.yml", "**.yaml" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: "Tests + Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Installs dependencies and handles caching
      - name: Run tests
        run: bundle exec rake
      - name: Run lint
        run: bundle exec rubocop
