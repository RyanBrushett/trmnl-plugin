name: Deploy

# Deploys to Cloud Run once the Ruby workflow has passed on main.
on:
  workflow_run:
    workflows: ["Ruby"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  REGION: northamerica-northeast1
  JOB: trmnl-push

jobs:
  deploy:
    name: "Deploy Cloud Run job"
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - name: Checkout the commit that passed
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      # Only the source is passed: the service account, env vars and secrets
      # already on the job are kept.
      - name: Deploy
        run: gcloud run jobs deploy "$JOB" --source . --region "$REGION"
